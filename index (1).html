<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Postura">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Postura al Día</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una pregunta por pantalla; barra de progreso arriba, contenido al centro, botón grande fijo abajo con hoja de retroalimentación */
:root{
  --bg:#f6f7f0; --surface:#ffffff; --ink:#1f2a22; --muted:#5d6a5f; --line:#dde3d4; --line-strong:#c7d0bd;
  --green:#3c7a46; --green-dark:#2a5a33; --yolk:#e09b12; --yolk-dark:#b47908; --yolk-soft:#fdf1d6;
  --ok:#2f8a4a; --ok-bg:#e1f3e5; --warn:#a96a00; --warn-bg:#fdf0d6; --bad:#c0392b; --bad-bg:#fbe3e0;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a15; --surface:#1c241e; --ink:#eaf0e8; --muted:#a5b3a8; --line:#2f3b31; --line-strong:#3e4c40;
  --green:#5fae6c; --green-dark:#3d7f49; --yolk:#f2b33a; --yolk-dark:#c48a17; --yolk-soft:#3a2f16;
  --ok:#7fd196; --ok-bg:#1d3a25; --warn:#f2b45a; --warn-bg:#3b2d13; --bad:#f08a80; --bad-bg:#3f1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a15; --surface:#1c241e; --ink:#eaf0e8; --muted:#a5b3a8; --line:#2f3b31; --line-strong:#3e4c40;
  --green:#5fae6c; --green-dark:#3d7f49; --yolk:#f2b33a; --yolk-dark:#c48a17; --yolk-soft:#3a2f16;
  --ok:#7fd196; --ok-bg:#1d3a25; --warn:#f2b45a; --warn-bg:#3b2d13; --bad:#f08a80; --bad-bg:#3f1f1c; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;box-sizing:border-box}
.topbar{display:flex;align-items:center;gap:12px;min-height:40px}
.iconbtn{background:none;border:0;color:var(--muted);font-size:1.5rem;line-height:1;padding:6px;cursor:pointer;border-radius:8px}
.progress{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:20px 150px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:2rem;color:var(--green)}
h2{font-size:1.55rem}
p{margin:0}
.lead{color:var(--muted)}
.speech{display:flex;gap:12px;align-items:flex-end}
.speech svg{flex:0 0 auto}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1rem}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;cursor:pointer;min-height:56px}
.choice .em{font-size:1.5rem;width:1.8rem;text-align:center}
.choice small{display:block;color:var(--muted);font-size:.85rem}
.choice[aria-pressed="true"]{border-color:var(--green);background:var(--ok-bg)}
.choice:active{transform:translateY(2px);border-bottom-width:2px}
.numwrap{display:flex;align-items:center;gap:10px}
.numwrap input{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:2.2rem;text-align:center;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px;box-sizing:border-box;font-variant-numeric:tabular-nums}
.step{width:56px;height:56px;flex:0 0 56px;font-size:1.6rem;font-weight:800;color:var(--green);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;cursor:pointer}
.unit{color:var(--muted);text-align:center;font-size:.95rem}
.skip{align-self:center;background:none;border:0;color:var(--green);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
/* barra inferior */
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .2s}
.bottom .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bottom.ok{background:var(--ok-bg);border-color:transparent}.bottom.warn{background:var(--warn-bg);border-color:transparent}.bottom.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:none;gap:4px;flex-direction:column}
.bottom.ok .fb,.bottom.warn .fb,.bottom.bad .fb{display:flex}
.fb b{font-family:var(--display);font-size:1.3rem}
.bottom.ok .fb b{color:var(--ok)}.bottom.warn .fb b{color:var(--warn)}.bottom.bad .fb b{color:var(--bad)}
.fb p{font-size:.98rem}
.btn{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;width:100%;padding:14px;border-radius:14px;border:0;border-bottom:4px solid var(--green-dark);background:var(--green);color:#fff;cursor:pointer}
.btn:disabled{background:var(--line);border-bottom-color:var(--line-strong);color:var(--muted);cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.bottom.warn .btn{background:var(--yolk);border-bottom-color:var(--yolk-dark)}
.bottom.bad .btn{background:var(--bad);border-bottom-color:#8e2a20}
.btn.alt{background:var(--surface);color:var(--green);border:2px solid var(--line);border-bottom-width:4px}
/* resultado */
.score{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.score .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big b{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.meter{position:relative;height:18px;background:var(--line);border-radius:99px}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter .mark{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ink);border-radius:2px}
.meterlbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:.82rem}
.sec h3{font-family:var(--display);font-size:1.2rem;margin:0 0 8px}
.cards{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card.bad{border-color:var(--bad)}.card.warn{border-color:var(--yolk)}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.card p{font-size:.95rem;color:var(--muted)}
.card .todo{color:var(--ink)}
.card .todo b{color:var(--green)}
.goods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.goods li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.goods.tips{color:var(--muted)}.goods.tips li::before{content:"•";color:var(--yolk)}
.note{font-size:.82rem;color:var(--muted)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.progress span{transition:none}}
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" id="back" type="button" aria-label="Volver atrás">‹</button>
    <div class="progress" role="progressbar" aria-label="Avance" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
    <button class="iconbtn" id="restart" type="button" aria-label="Empezar de nuevo">↺</button>
  </div>
  <main id="screen" aria-live="polite"></main>
</div>
<div class="bottom" id="bottom">
  <div class="in">
    <div class="fb" id="fb"><b id="fbT"></b><p id="fbP"></p></div>
    <button class="btn" id="go" type="button">Empezar</button>
  </div>
</div>

<script>
const LINEAS=[
  {id:"hyline-brown",nombre:"Hy-Line Brown",em:"🟤",sub:"Huevo marrón",delta:0,alim:110},
  {id:"lohmann-brown",nombre:"Lohmann Brown",em:"🟤",sub:"Huevo marrón",delta:-0.8,alim:115},
  {id:"isa-brown",nombre:"ISA Brown",em:"🟤",sub:"Huevo marrón",delta:-0.4,alim:112},
  {id:"hyline-w36",nombre:"Hy-Line W-36",em:"⚪",sub:"Huevo blanco",delta:0.8,alim:98},
  {id:"nose",nombre:"No sé cuál es",em:"❔",sub:"Usaremos una tabla promedio de gallina marrón",delta:-0.4,alim:112}
];
const CURVA=[[18,10],[19,35],[20,65],[21,83],[22,90],[23,93],[24,94],[25,95],[30,95],[35,94],[40,92.5],[45,91],[50,89],[55,87],[60,85],[65,82.5],[70,80],[75,77],[80,74],[85,71],[90,68],[100,63]];
const linea=()=>LINEAS.find(l=>l.id===A.linea)||LINEAS[4];
function estandar(sem){
  if(sem<18)return 0;let v=CURVA[CURVA.length-1][1];
  for(let i=0;i<CURVA.length-1;i++){const[a,va]=CURVA[i],[b,vb]=CURVA[i+1];if(sem>=a&&sem<=b){v=va+(vb-va)*(sem-a)/(b-a);break}}
  if(sem>=22)v+=linea().delta;return Math.max(0,Math.min(97,Math.round(v*10)/10));
}
const fmt=(n,d=1)=>Number(n).toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const int=n=>Math.round(n).toLocaleString("es-PE");
const KEY="postura-al-dia-quiz-v1";
let A={};try{A=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
if(!A.aves){A={linea:"hyline-brown",aves:1000,edad:32,huevos:870,muertes:3,alimento:105,temp:"calor",luz:"16",agua:"si",sintomas:["ninguno"],precio:0.4,_ejemplo:true}}
const save=()=>{try{const{_ejemplo,...r}=A;localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}};

function hen(size=72){return `<svg width="${size}" height="${size}" viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="74" rx="22" ry="4" fill="var(--line)"/><path d="M18 52c0-17 10-30 24-30 9 0 15 6 15 14 6-2 12 1 12 7 0 15-13 26-28 26S18 63 18 52z" fill="var(--yolk)"/><path d="M36 22c-2-6 2-10 5-8 1-5 7-5 7 0 4-2 7 3 4 7" fill="#d64a3a"/><circle cx="48" cy="33" r="3.2" fill="var(--ink)"/><circle cx="49" cy="32" r="1" fill="#fff"/><path d="M56 36l9 3-9 3z" fill="#f08c1a"/><path d="M53 43c2 3 2 6 0 8-2-2-2-5 0-8z" fill="#d64a3a"/><path d="M26 50c5 6 14 7 20 2" stroke="var(--yolk-dark)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 70v6M44 70v6" stroke="#f08c1a" stroke-width="3" stroke-linecap="round"/></svg>`}
const say=t=>`<div class="speech">${hen()}<div class="bubble">${t}</div></div>`;

/* Preguntas */
const STEPS=[
 {id:"linea",type:"choice",q:"¿Qué línea de gallina tienes?",hint:"Cada línea genética tiene su propia tabla de producción.",
  opts:LINEAS.map(l=>({v:l.id,t:l.nombre,s:l.sub,em:l.em})),
  fb:()=>["ok","¡Bien!",A.linea==="nose"?"No pasa nada. Pregunta a tu proveedor de pollitas el nombre de la línea: con ella el diagnóstico es más exacto.":`${linea().nombre} llega a su punto más alto (pico de postura) cerca de la semana 25, con alrededor de ${fmt(estandar(25),0)}% de postura.`]},
 {id:"aves",type:"num",q:"¿Cuántas gallinas vivas tienes en el lote?",unit:"gallinas",min:1,step:10,hint:"Cuenta solo las que están en postura.",
  fb:()=>["ok","Anotado",`Con ${int(A.aves)} gallinas, cada punto de % de postura equivale a ${int(A.aves/100)} huevos al día.`]},
 {id:"edad",type:"num",q:"¿Cuántas semanas de edad tienen?",unit:"semanas desde que nacieron",min:1,max:110,step:1,hint:"Si las compraste de 16 semanas hace 10 semanas, hoy tienen 26.",
  fb:()=>{const s=estandar(A.edad);if(A.edad<18)return["warn","Aún son jóvenes","Antes de la semana 18 normalmente no ponen. La postura empieza entre las semanas 18 y 20."];return["ok","¿Sabías que?",`A la semana ${A.edad}, la tabla dice que de cada 100 gallinas, ${fmt(s,0)} deberían poner un huevo al día. Con tus aves son unos ${int(s/100*A.aves)} huevos.`]}},
 {id:"huevos",type:"num",q:"¿Cuántos huevos recogiste hoy?",unit:"huevos (incluye rotos y sucios)",min:0,step:10,hint:"Si recoges varias veces al día, suma todo.",
  fb:()=>{const r=real(),s=estandar(A.edad),d=r-s;if(s===0)return["ok","Anotado",`Tu postura hoy es ${fmt(r)}%.`];const t=`Tu postura es ${fmt(r)}%: de cada 100 gallinas, ${fmt(r,0)} pusieron. La tabla espera ${fmt(s)}%.`;return d>=-2?["ok","¡Excelente!",t]:d>=-6?["warn","Un poco por debajo",t+" Sigamos para encontrar la causa."]:["bad","Muy por debajo",t+" Sigamos para encontrar la causa."]}},
 {id:"muertes",type:"num",q:"¿Cuántas gallinas murieron en los últimos 7 días?",unit:"aves muertas",min:0,step:1,
  fb:()=>{const p=A.muertes/A.aves*100;const t=`Eso es ${fmt(p,2)}% del lote en una semana. Lo normal es menos de 0.1% (1 de cada 1000).`;return p<=0.1?["ok","¡Bien!",t]:p<=0.5?["warn","Atención",t]:["bad","Mortalidad alta",t+" Puede haber una enfermedad."]}},
 {id:"alimento",type:"num",q:"¿Cuántos kilos de alimento das al día?",unit:"kg por día para todo el lote",min:0,step:5,optional:true,hint:"Si no sabes, puedes saltar esta pregunta.",
  fb:()=>{if(A.alimento==null)return["warn","Pregunta saltada","Pesar el alimento ayuda mucho: una gallina en postura come unos 110 g al día."];const g=A.alimento*1000/A.aves,o=linea().alim;const t=`Cada gallina come unos ${int(g)} g al día. Su línea necesita cerca de ${o} g.`;return g>=o*0.92?["ok","¡Bien alimentadas!",t]:["bad","Comen poco",t+" Sin alimento suficiente no hay huevos."]}},
 {id:"temp",type:"choice",q:"¿Cómo está el calor en el galpón a mediodía?",
  opts:[{v:"fresco",t:"Fresco",s:"Menos de 28 °C",em:"🌤️"},{v:"calor",t:"Caluroso",s:"Entre 28 y 32 °C",em:"☀️"},{v:"mucho",t:"Muy caluroso",s:"Más de 32 °C, las aves jadean con el pico abierto",em:"🔥"}],
  fb:()=>A.temp==="fresco"?["ok","¡Bien!","Entre 18 y 27 °C las gallinas comen y ponen mejor."]:A.temp==="calor"?["warn","¿Sabías que?","Sobre 28 °C las gallinas comen menos y la postura y el tamaño del huevo bajan."]:["bad","Estrés por calor","Con más de 32 °C las aves jadean, comen poco y ponen menos. Es una causa muy común en la selva."]},
 {id:"luz",type:"choice",q:"¿Cuántas horas de luz reciben al día?",hint:"Suma la luz del sol y la de focos.",
  opts:[{v:"12",t:"Solo luz del día",s:"Unas 12 horas",em:"🌅"},{v:"14",t:"Un poco de foco",s:"Entre 13 y 15 horas",em:"💡"},{v:"16",t:"16 horas o más",s:"Prendo focos en la madrugada o noche",em:"✨"}],
  fb:()=>A.luz==="16"?["ok","¡Muy bien!","La luz estimula a la gallina a poner. En postura se recomiendan 16 horas diarias."]:["warn","¿Sabías que?","La luz le avisa a la gallina que es momento de poner. Con menos de 16 horas, la postura baja."]},
 {id:"agua",type:"choice",q:"¿Cómo estuvo el agua esta semana?",
  opts:[{v:"si",t:"Limpia y siempre disponible",em:"💧"},{v:"no",t:"Faltó o estaba sucia algún día",em:"🚱"}],
  fb:()=>A.agua==="si"?["ok","¡Perfecto!","Una gallina toma casi el doble de agua que de alimento."]:["bad","Muy importante","Un solo día sin agua puede bajar la postura durante varios días."]},
 {id:"sintomas",type:"multi",q:"¿Notaste alguna de estas señales?",hint:"Puedes marcar varias.",
  opts:[{v:"cascara",t:"Cáscara débil o huevos deformes",em:"🥚"},{v:"tristes",t:"Aves decaídas, tos o estornudos",em:"🤧"},{v:"diarrea",t:"Diarrea o heces raras",em:"💩"},{v:"plumas",t:"Pérdida de plumas",em:"🪶"},{v:"picaje",t:"Se picotean o comen huevos",em:"🐓"},{v:"ninguno",t:"Ninguna señal",em:"✅"}],
  fb:()=>A.sintomas.includes("ninguno")?["ok","¡Buena señal!","Que no haya síntomas descarta muchas enfermedades."]:["warn","Gracias por observar","Estas señales nos ayudan a encontrar el origen. Mira el diagnóstico."]},
 {id:"precio",type:"num",q:"¿A cuánto vendes cada huevo?",unit:"soles por huevo",min:0,step:0.05,dec:true,optional:true,hint:"Así calculamos cuánto dinero pierdes.",
  fb:()=>{const f=faltan();return f>0&&A.precio?["warn","Mira esto",`Te faltan ${int(f)} huevos al día. Eso son S/ ${fmt(f*A.precio*30,0)} al mes que no estás ganando.`]:["ok","¡Listo!","Ya tenemos todo para tu diagnóstico."]}}
];
const real=()=>A.aves>0?A.huevos/A.aves*100:0;
const faltan=()=>Math.max(0,estandar(A.edad)/100*A.aves-A.huevos);

let i=-1,phase="ask";
const $=id=>document.getElementById(id);

function setBar(){const p=i<0?0:i>=STEPS.length?100:(i/STEPS.length)*100;$("bar").style.width=p+"%";$("bar").parentElement.setAttribute("aria-valuenow",Math.round(p))}
function bottom(cls,btn,dis){$("bottom").className="bottom"+(cls?" "+cls:"");$("go").textContent=btn;$("go").disabled=!!dis}

function render(){
  setBar();phase="ask";bottom("", "Comprobar",false);
  $("back").style.visibility=i<0?"hidden":"visible";
  const sc=$("screen");sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop");
  if(i<0){
    sc.innerHTML=`<h1>Postura al Día</h1>${say("¡Hola! Soy Clarita. En unos 2 minutos vamos a revisar cómo ponen tus gallinas y, si producen menos de lo esperado, te ayudo a encontrar por qué.")}
      <p class="lead">Responde 11 preguntas cortas. Después de cada respuesta te explico algo nuevo.</p>
      ${A._ejemplo?'<p class="note">Las respuestas vienen con un ejemplo de 1000 gallinas. Cámbialas por las tuyas.</p>':'<p class="note">Guardamos tus últimas respuestas en este celular para que vayas más rápido.</p>'}`;
    bottom("","Empezar");return;
  }
  if(i>=STEPS.length){return result()}
  const s=STEPS[i];let h=`<h2>${s.q}</h2>${s.hint?`<p class="lead">${s.hint}</p>`:""}`;
  if(s.type==="num"){
    const v=A[s.id]==null?"":A[s.id];
    h+=`<div class="numwrap"><button class="step" type="button" data-d="-1" aria-label="Menos">−</button><input id="num" type="number" inputmode="${s.dec?"decimal":"numeric"}" min="${s.min}" ${s.max?`max="${s.max}"`:""} step="${s.step}" value="${v}" aria-label="${s.q}"><button class="step" type="button" data-d="1" aria-label="Más">+</button></div><p class="unit">${s.unit}</p>`;
    if(s.optional)h+=`<button class="skip" type="button" id="skip">No sé, saltar</button>`;
  }else{
    const cur=s.type==="multi"?(A[s.id]||[]):[A[s.id]];
    h+=`<div class="choices">${s.opts.map(o=>`<button class="choice" type="button" data-v="${o.v}" aria-pressed="${cur.includes(o.v)}"><span class="em" aria-hidden="true">${o.em}</span><span><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:""}</span></button>`).join("")}</div>`;
  }
  sc.innerHTML=h;
  if(s.type==="num"){
    const inp=$("num");const chk=()=>{$("go").disabled=inp.value===""||isNaN(+inp.value)};chk();
    inp.addEventListener("input",chk);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("go").disabled)$("go").click()});
    sc.querySelectorAll(".step").forEach(b=>b.addEventListener("click",()=>{const n=Math.max(s.min,(+inp.value||0)+(+b.dataset.d)*s.step);inp.value=s.dec?Math.round(n*100)/100:Math.round(n);chk()}));
    if($("skip"))$("skip").addEventListener("click",()=>{A[s.id]=null;check()});
  }else{
    const upd=()=>{const sel=[...sc.querySelectorAll('.choice[aria-pressed="true"]')];$("go").disabled=!sel.length};upd();
    sc.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
      if(s.type==="multi"){
        const isN=b.dataset.v==="ninguno";
        if(isN)sc.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed","false"));
        else sc.querySelector('[data-v="ninguno"]').setAttribute("aria-pressed","false");
        b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");
      }else{sc.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")}
      upd();
    }));
  }
}
function check(){
  const s=STEPS[i];
  if(s.type==="num"&&A[s.id]!==null){const v=+$("num").value;if(isNaN(v))return;A[s.id]=v}
  else if(s.type==="choice")A[s.id]=document.querySelector('.choice[aria-pressed="true"]').dataset.v;
  else if(s.type==="multi")A[s.id]=[...document.querySelectorAll('.choice[aria-pressed="true"]')].map(b=>b.dataset.v);
  delete A._ejemplo;save();
  const[c,t,p]=s.fb();$("fbT").textContent=t;$("fbP").textContent=p;
  phase="fb";bottom(c,"Continuar");
  document.querySelectorAll("#screen button,#screen input").forEach(e=>e.disabled=true);
  if(A[s.id]===null)A[s.id]=undefined;
}
$("go").addEventListener("click",()=>{
  if(i<0||i>=STEPS.length){i=i<0?0:0;render();return}
  if(phase==="ask")check();else{i++;render()}
});
$("back").addEventListener("click",()=>{if(i>0){i=Math.min(i,STEPS.length)-1;render()}else{i=-1;render()}});
$("restart").addEventListener("click",()=>{i=-1;render()});

function diagnose(){
  const s=estandar(A.edad),r=real(),d=r-s,c=[],ok=[];
  const add=(k,h,p,todo)=>c.push({k,h,p,todo});
  if(A.edad<18)return{c,ok,pre:true};
  if(A.agua==="no")add("bad","Falta o mala calidad de agua","Sin agua la gallina deja de comer y de poner.","Limpia bebederos hoy y revisa que nunca falte agua fresca.");else ok.push("El agua está bien.");
  if(A.alimento!=null){const g=A.alimento*1000/A.aves,o=linea().alim;if(g<o*0.92)add("bad","Consumo de alimento bajo",`Cada gallina come ${int(g)} g y necesita unos ${o} g al día.`,`Sube la ración a unos ${fmt(o*A.aves/1000,0)} kg por día, revisa que el alimento no esté húmedo o con hongos y que haya espacio en comederos.`);else ok.push("La cantidad de alimento es suficiente.")}
  if(A.temp==="mucho")add("bad","Estrés por calor","Con más de 32 °C las gallinas jadean, comen poco y ponen menos.","Abre cortinas, moja el techo en las horas de calor, da agua fresca y sirve el alimento temprano y al atardecer.");
  else if(A.temp==="calor")add("warn","Calor moderado","Entre 28 y 32 °C ya baja el consumo de alimento.","Mejora la ventilación y da el alimento en las horas frescas.");else ok.push("La temperatura es buena.");
  if(A.luz!=="16")add("warn","Pocas horas de luz","La luz estimula la postura; se necesitan unas 16 horas al día.","Prende focos antes del amanecer hasta completar 16 horas. No las reduzcas mientras estén en postura.");else ok.push("Las horas de luz son correctas.");
  const pm=A.muertes/A.aves*100;
  if(pm>0.5)add("bad","Mortalidad alta",`Murió el ${fmt(pm,2)}% del lote en una semana.`,"Retira las aves muertas y lleva 2 o 3 al veterinario para que revise la causa.");else if(pm>0.1)add("warn","Mortalidad algo elevada",`Murió el ${fmt(pm,2)}% del lote en una semana.`,"Observa a las aves cada día y separa las que se vean decaídas.");else ok.push("La mortalidad es normal.");
  const sy=A.sintomas||[];
  if(sy.includes("tristes"))add("bad","Posible enfermedad respiratoria","Tos, estornudos y aves decaídas pueden ser Newcastle, bronquitis o coriza.","Separa las aves enfermas, revisa el calendario de vacunas y llama al veterinario hoy.");
  if(sy.includes("cascara"))add("warn","Problema de cáscara","Cáscara débil o huevos deformes indican falta de calcio o una enfermedad como bronquitis.","Revisa que el alimento sea de postura (con calcio) y ofrece conchilla. Si hay tos, consulta al veterinario.");
  if(sy.includes("diarrea"))add("warn","Problema digestivo","Las heces raras indican parásitos, alimento en mal estado o una infección intestinal.","Revisa el alimento, desparasita según indicación del veterinario y mantén la cama seca.");
  if(sy.includes("plumas"))add("warn","Pérdida de plumas","Puede ser muda, ácaros o piojos, o estrés.","Revisa de noche plumas y cloaca buscando ácaros o piojos.");
  if(sy.includes("picaje"))add("warn","Picaje o huevos comidos","Los huevos comidos cuentan como baja producción.","Recoge huevos más seguido, oscurece los nidos y revisa el calcio y la proteína del alimento.");
  if(A.edad>=70)add("warn","Edad del lote",`Con ${A.edad} semanas la postura baja de forma natural.`,"Calcula si lo que ganas por huevos todavía cubre el costo del alimento.");
  if(A.edad<26&&d<-2)add("warn","Inicio de postura lento","Al inicio, la causa común es poco peso corporal.","Pesa 50 gallinas y compara el promedio con la guía de la línea.");
  return{c:c.sort((a,b)=>(a.k==="bad"?0:1)-(b.k==="bad"?0:1)),ok,d,r,s};
}

function result(){
  setBar();$("back").style.visibility="visible";
  const D=diagnose(),sc=$("screen");
  if(D.pre){sc.innerHTML=`<h2>Tus gallinas aún no ponen</h2>${say(`Con ${A.edad} semanas todavía no deberían poner. La postura empieza entre las semanas 18 y 20. Vuelve a hacer el diagnóstico cuando empiecen.`)}`;bottom("","Hacer otro diagnóstico");return}
  const st=D.d>=-2?["ok","¡Tus gallinas van muy bien!","var(--ok)"]:D.d>=-6?["warn","Producen un poco menos de lo esperado","var(--yolk)"]:["bad","Producen mucho menos de lo esperado","var(--bad)"];
  const f=faltan(),ganan=f*(A.precio||0)*30;
  const msg=st[0]==="ok"?"¡Felicitaciones! Sigue con el mismo manejo y repite este diagnóstico cada semana.":D.c.length?`Encontré ${D.c.length} ${D.c.length===1?"posible causa":"posibles causas"}. Empieza por las marcadas en rojo.`:"No encontré una causa clara en tus respuestas. Revisa la lista de abajo con calma.";
  sc.innerHTML=`<h2>${st[1]}</h2>${say(msg)}
  <div class="score">
    <div class="big"><b style="color:${st[2]}">${fmt(D.r)}%</b><span class="lead">de postura hoy · la tabla espera <strong>${fmt(D.s)}%</strong></span></div>
    <div class="meter" aria-hidden="true"><div class="fill" style="width:${Math.min(100,D.r)}%;background:${st[2]}"></div><div class="mark" style="left:calc(${D.s}% - 2px)"></div></div>
    <div class="meterlbl"><span>0%</span><span>▮ = tabla de ${linea().nombre==="No sé cuál es"?"referencia":linea().nombre}</span><span>100%</span></div>
    <div class="facts">
      <div class="fact"><b>${int(A.huevos)}</b><small>huevos hoy</small></div>
      <div class="fact"><b>${int(D.s/100*A.aves)}</b><small>huevos esperados</small></div>
      ${f>0?`<div class="fact"><b style="color:${st[2]}">${int(f)}</b><small>huevos que faltan al día</small></div><div class="fact"><b style="color:${st[2]}">${A.precio?"S/ "+fmt(ganan,0):"–"}</b><small>${A.precio?"dejas de ganar al mes":"indica el precio del huevo para calcularlo"}</small></div>`:""}
    </div>
  </div>
  ${D.c.length?`<div class="sec"><h3>Posibles causas y qué hacer</h3><ul class="cards">${D.c.map(x=>`<li class="card ${x.k}"><span class="tag ${x.k}">${x.k==="bad"?"Urgente":"Revisar"}</span><b>${x.h}</b><p>${x.p}</p><p class="todo"><b>Qué hacer hoy:</b> ${x.todo}</p></li>`).join("")}</ul></div>`:""}
  ${D.ok.length?`<div class="sec"><h3>Lo que estás haciendo bien</h3><ul class="goods">${D.ok.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}
  ${st[0]!=="ok"?`<div class="sec"><h3>Si nada de esto explica la baja</h3><ul class="goods tips"><li>Revisa si hay huevos escondidos, rotos o que se llevan otras personas.</li><li>Busca ácaros y piojos de noche.</li><li>Evita ruidos, visitas y cambios bruscos de horario.</li><li>Confirma que el alimento sea de postura y tenga calcio.</li></ul></div>`:""}
  <p class="note">La tabla usa valores aproximados de la guía de cada línea. Ante aves enfermas, consulta siempre a un veterinario.</p>`;
  bottom(st[0]==="ok"?"":"","Hacer otro diagnóstico");
}
render();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
