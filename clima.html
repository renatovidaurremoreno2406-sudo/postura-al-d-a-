const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sinTilde=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const KEY="postura-clima-v2";
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>Number(n).toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIAS_L=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fecha=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

/* ---------- Reglas de alerta ----------
   Calor: índice para aves = temperatura (°F) + humedad relativa (%), máximo de las horas del día.
   Solo cuentan las horas con 28 °C o más. Regla práctica avícola: menos de 150 normal, 150 a 159 atención, 160 o más peligro.
   También peligro si la máxima llega a 35 °C.
   Lluvia: 25 mm o más en el día = atención; 50 mm o más = peligro;
   80 mm o más sumando 3 días seguidos = riesgo de caminos cortados y desbordes. */
function analizar(api){
  const d=api.daily,h=api.hourly,dias=[];
  for(let i=0;i<d.time.length;i++){
    let idx=0;
    for(let k=0;k<h.time.length;k++){
      if(h.time[k].slice(0,10)!==d.time[i])continue;
      const t=h.temperature_2m[k],rh=h.relative_humidity_2m[k];
      if(t==null||rh==null||t<28)continue;
      idx=Math.max(idx,t*9/5+32+rh);
    }
    const tmax=d.temperature_2m_max[i],tmin=d.temperature_2m_min[i];
    const lluvia=d.precipitation_sum[i]||0,prob=d.precipitation_probability_max?d.precipitation_probability_max[i]:null;
    const calor=(tmax>=35||idx>=160)?2:(tmax>=31||idx>=150)?1:0;
    let lluv=lluvia>=50?2:lluvia>=25?1:0;
    const acum=[0,1,2].reduce((s,j)=>s+(i+j<d.time.length?(d.precipitation_sum[i+j]||0):0),0);
    const acumPrev=[-2,-1,0].reduce((s,j)=>s+(i+j>=0?(d.precipitation_sum[i+j]||0):0),0);
    const caminos=Math.max(acum,acumPrev)>=80&&lluvia>=10;
    if(caminos)lluv=2;
    const frio=tmin<=0?2:tmin<=5?1:0;
    dias.push({fecha:d.time[i],tmax,tmin,idx:Math.round(idx),lluvia,prob,calor,lluv,frio,caminos,nivel:Math.max(calor,lluv,frio)});
  }
  return dias;
}

const ACCIONES={
  calor1:{t:"Calor: cuida el agua",l:1,em:"☀️",items:[

    "Cierra cortinas|al atardecer. Deja una rendija arriba para ventilar.",
    "Cama gruesa|y seca, de 10 cm.",
    "Más alimento:|con frío comen más para calentarse.",

  caminos:{t:"Caminos en riesgo",l:2,em:"🚧",items:[
    "Varios días de lluvia|traen huaicos y desbordes.",
    "Guarda reserva|de alimento, medicinas y combustible.",
    "Acuerda la entrega|con tus compradores hoy."]}
};
const html=t=>{const[a,b]=t.split("|");return`<b>${a}</b> ${b}`};
const wa=t=>{const[a,b]=t.split("|");return`*${a}* ${b}`};

function resumen(dias){
  const max=Math.max(...dias.map(x=>x.nivel));
  const tipos=[];
  const c=Math.max(...dias.map(x=>x.calor)),l=Math.max(...dias.map(x=>x.lluv));
  if(dias.some(x=>x.caminos))tipos.push("caminos");
  if(l===2)tipos.push("lluvia2");else if(l===1)tipos.push("lluvia1");
  if(c===2)tipos.push("calor2");else if(c===1)tipos.push("calor1");
  const f=Math.max(...dias.map(x=>x.frio));
  if(f===2)tipos.push("frio2");else if(f===1)tipos.push("frio1");
  tipos.sort((a,b)=>ACCIONES[b].l-ACCIONES[a].l);
  return{max,tipos};
}
const icono=x=>x.frio>Math.max(x.lluv,x.calor)?(x.frio===2?"❄️":"🥶"):x.lluv>=x.calor&&x.lluv>0?(x.lluv===2?"⛈️":"🌧️"):x.calor===2?"🔥":x.calor===1?"☀️":x.lluvia>=5?"🌦️":"🌤️";
function frase(x){
  const p=[];
  if(x.calor===2)p.push("calor fuerte");else if(x.calor===1)p.push("calor");
  if(x.lluv===2)p.push(x.caminos?"caminos en riesgo":"lluvia muy fuerte");else if(x.lluv===1)p.push("lluvia fuerte");
  if(x.frio===2)p.push("helada");else if(x.frio===1)p.push("frío fuerte");
  return p.join(" y ");
}

function textoWhatsApp(nombre,dias,R){
  const L=[`*📡 Radar del Clima: ${nombre}*`,`Próximos 7 días:`];
  dias.forEach(x=>{const f=fecha(x.fecha);L.push(`${icono(x)} ${DIAS[f.getDay()]} ${f.getDate()}: ${fmt(x.tmax)}°C, ${fmt(x.lluvia)} mm${x.nivel?` (${frase(x)})`:""}`)});
  if(R.tipos.length){
    L.push("","*Haz esto y no pierdas huevos:*");
    R.tipos.forEach(k=>{L.push(`${ACCIONES[k].em} _${ACCIONES[k].t}_`);ACCIONES[k].items.slice(0,4).forEach(t=>L.push("• "+wa(t)))});
  }else L.push("","Semana tranquila. Agua limpia, cama seca y a producir.");
  L.push("","Mira el pronóstico de tu zona: "+location.href.split("#")[0]);
  return L.join("\n");
}

function pintar(nombre,dias,cuando,offline){
  const R=resumen(dias),hoy=dias[0];
  const prox=dias.find(x=>x.nivel===R.max&&R.max>0);
  let tit,txt;
  if(R.max===0){tit="Semana tranquila";txt="Sin calor fuerte ni lluvias intensas. Agua limpia, cama seca y a producir."}
  else{const f=fecha(prox.fecha),esHoy=prox===hoy;tit=R.max===2?"Peligro esta semana":"Atención esta semana";const fr=frase(prox);txt=`${fr[0].toUpperCase()+fr.slice(1)} ${esHoy?"hoy. Actúa ya.":"el "+DIAS_L[f.getDay()]+" "+f.getDate()+". Prepárate hoy."}`}
  $("out").innerHTML=`
  <div class="status l${R.max}"><b class="t">${tit}</b><p>${txt}</p>
    <p class="note">Hoy: máx. ${fmt(hoy.tmax)}°C, mín. ${fmt(hoy.tmin)}°C, lluvia ${fmt(hoy.lluvia)} mm${hoy.prob!=null?` (prob. ${hoy.prob}%)`:""}.</p></div>
  <div class="days" role="list">${dias.map(x=>{const f=fecha(x.fecha);return`<div class="day l${x.nivel}" role="listitem" aria-label="${DIAS_L[f.getDay()]} ${f.getDate()}: máxima ${fmt(x.tmax)} grados, lluvia ${fmt(x.lluvia)} milímetros${x.nivel?", "+frase(x):""}"><small>${DIAS[f.getDay()]} ${f.getDate()}</small><span class="em" aria-hidden="true">${icono(x)}</span><b>${fmt(x.tmax)}°</b><small>${fmt(x.lluvia)} mm</small></div>`}).join("")}</div>
  ${R.tipos.length?`<section><h3>Haz esto y no pierdas huevos</h3><ul class="cards">${R.tipos.map(k=>{const a=ACCIONES[k];return`<li class="card l${a.l}"><span class="tag l${a.l}">${a.l===2?"Peligro":"Atención"}</span><b>${a.em} ${a.t}</b><ul>${a.items.map(t=>`<li>${html(t)}</li>`).join("")}</ul></li>`}).join("")}</ul></section>`:""}
  ${R.tipos.some(k=>k.startsWith("calor"))||R.tipos.includes("lluvia2")?`<div class="card l1"><b>🧪 Prepara a tus gallinas con biomontaña</b><p>${R.tipos.some(k=>k.startsWith("calor"))?"El calor debilita sus intestinos y bajan la postura.":"Con humedad y cama mojada, los intestinos se enferman."} Un probiótico en el agua las ayuda a resistir.</p><a class="btn main wa" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/51986563096?text=${encodeURIComponent("Hola, quiero pedir biomontaña. Viene "+(R.tipos.some(k=>k.startsWith("calor"))?"calor fuerte":"lluvia fuerte")+" en "+nombre+" y quiero proteger a mis gallinas.")}" target="_blank" rel="noopener">Pedir biomontaña</a></div>`:""}
  <button class="btn main wa" id="share" type="button">Avisa a otros por WhatsApp</button>
  <p class="note">${offline?"Sin internet. Último pronóstico guardado: ":"Actualizado: "}${new Date(cuando).toLocaleString("es-PE",{dateStyle:"medium",timeStyle:"short"})} · Pronóstico aproximado (Open-Meteo). Avisos oficiales: <a href="https://www.senamhi.gob.pe/?p=aviso-meteorologico" target="_blank" rel="noopener">Senamhi</a>.</p>`;
  $("share").addEventListener("click",()=>{
    const t=textoWhatsApp(nombre,dias,R);
    window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
  });
}

async function cargar(nombre,lat,lon){
  $("out").innerHTML=`<div class="msg">Mirando el cielo de ${nombre}…</div>`;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&hourly=temperature_2m,relative_humidity_2m&timezone=America%2FLima&forecast_days=7`;
  try{
    const r=await fetch(url);if(!r.ok)throw new Error(r.status);
    const api=await r.json();
    S.cache={[nombre]:{api,cuando:Date.now()}};save();
    pintar(nombre,analizar(api),Date.now(),false);
  }catch(e){
    const c=S.cache&&S.cache[nombre];
    if(c)pintar(nombre,analizar(c.api),c.cuando,true);
    else $("out").innerHTML=`<div class="msg">Sin conexión. Revisa tu internet y prueba otra vez.</div>`;
  }
}

/* Inicio: buscador para todo el Perú */
const q=$("q"),res=$("res");
function mostrarLugar(l){q.value="";$("place").innerHTML=`📍 <b>${esc(l.n)}</b>${l.r?" · "+esc(l.r):""}`;}
function elegirLugar(l){
  S.lugar=l;S.recientes=[l,...(S.recientes||[]).filter(x=>x.n!==l.n||x.r!==l.r)].slice(0,5);save();
  res.hidden=true;mostrarLugar(l);q.blur();cargar(l.n,l.lat,l.lon);
}
function lista(items,titulo){
  if(!items.length){res.innerHTML=`<li class="hd">Sin resultados. Prueba con la ciudad más cercana.</li>`;res.hidden=false;return}
  res.innerHTML=(titulo?`<li class="hd">${titulo}</li>`:"")+items.map((l,i)=>`<li><button type="button" data-i="${i}"><b>${esc(l.n)}</b>${l.r?`<small>${esc(l.r)}</small>`:""}</button></li>`).join("");
  res.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>elegirLugar(items[+b.dataset.i])));
  res.hidden=false;
}
const local=t=>{const k=sinTilde(t);return LUGARES.filter(l=>sinTilde(l[0]).includes(k)||sinTilde(l[1]).includes(k)).slice(0,8).map(l=>({n:l[0],r:l[1],lat:l[2],lon:l[3]}))};
let tmr,ultima=0;
async function buscar(t){
  const id=++ultima;
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(t)}&count=8&language=es&country_code=PE&format=json`);
    if(!r.ok)throw 0;const j=await r.json();if(id!==ultima)return;
    const items=(j.results||[]).map(x=>({n:x.name,r:[x.admin2&&x.admin2!==x.name?x.admin2:"",x.admin1].filter(Boolean).join(", "),lat:+x.latitude.toFixed(3),lon:+x.longitude.toFixed(3)}));
    lista(items.length?items:local(t));
  }catch(e){if(id===ultima)lista(local(t),"Sin internet: ciudades principales")}
}
q.addEventListener("input",()=>{clearTimeout(tmr);const t=q.value.trim();if(t.length<2){recientes();return}tmr=setTimeout(()=>buscar(t),300)});
q.addEventListener("focus",()=>{if(q.value.trim().length<2)recientes()});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){res.hidden=true;q.blur()}if(e.key==="Enter"){const b=res.querySelector("button");if(b)b.click()}});
document.addEventListener("click",e=>{if(!e.target.closest(".search,.res"))res.hidden=true});
function recientes(){const r=S.recientes||[];if(r.length)lista(r,"Recientes");else res.hidden=true}
$("gps").addEventListener("click",()=>{
  if(!navigator.geolocation){alert("Tu celular no permite usar la ubicación.");return}
  $("out").innerHTML=`<div class="msg">Buscando tu ubicación…</div>`;
  navigator.geolocation.getCurrentPosition(p=>{
    elegirLugar({n:"Mi ubicación",r:"",lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)});
  },()=>{$("out").innerHTML=`<div class="msg">No encontramos tu ubicación. Escribe tu distrito.</div>`},{timeout:15000});
});
const inicial=S.lugar&&typeof S.lugar==="object"?S.lugar:{n:"Tarapoto",r:"San Martín",lat:-6.4886,lon:-76.36};
mostrarLugar(inicial);cargar(inicial.n,inicial.lat,inicial.lon);
</script>
